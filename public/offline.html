<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Ferramenta</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #1e293b;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 380px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    img {
      width: 110px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 0.5rem;
      color: #1e3a8a;
    }
    p {
      font-size: 0.95rem;
      color: #64748b;
      margin: 0 0 1.5rem;
      line-height: 1.4;
    }
    button {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 8px;
      background: #1e3a8a;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:active {
      opacity: 0.85;
    }
    #backup-emoji {
      display: none;
      font-size: 3.5rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      src="/offline.png"
      alt="Dispositivo offline"
      onerror="this.style.display='none'; document.getElementById('backup-emoji').style.display='block';"
    />
    <div id="backup-emoji">🔌</div>
    <h1>Sei offline</h1>
    <p>La connessione internet non è disponibile. Controlla la tua rete per continuare a sfogliare il catalogo della ferramenta.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
